name: render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['reel.py', 'assets/**', '.github/workflows/render.yml']

jobs:
  chunk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        i: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python deps
        run: pip install -q numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Render chunk ${{ matrix.i }}
        run: python reel.py --render part_${{ matrix.i }}.mp4 --chunk ${{ matrix.i }}/6
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.i }}
          path: part_${{ matrix.i }}.mp4
          retention-days: 3

  mux:
    needs: chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python deps
        run: pip install -q numpy==2.2.6 opencv-python-headless==4.11.0.86
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
      - name: Pencil sound
        run: python reel.py --audio pencil.wav
      - name: Join chunks and add sound
        run: |
          for i in 0 1 2 3 4 5; do echo "file 'part_$i.mp4'" >> list.txt; done
          ffmpeg -y -v error -f concat -safe 0 -i list.txt -c copy video.mp4
          ffmpeg -y -v error -i video.mp4 -i pencil.wav -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart ant_reel.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,nb_frames -of compact ant_reel.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: ant-reel
          path: ant_reel.mp4
          retention-days: 14
